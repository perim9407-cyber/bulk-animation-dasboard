<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Ultimate Tool: Animation & Music Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-xl font-bold text-center mb-1 text-indigo-400">Roblox Ultimate Control Hub</h1>
        <p class="text-xs text-slate-400 text-center mb-6">Kelola Bulk Animation Script & Auto-Publish Music Bypass dalam satu tempat.</p>

        <!-- Tab Navigation -->
        <div class="grid grid-cols-2 gap-2 mb-6 bg-slate-950 p-1 rounded-xl border border-slate-800">
            <button onclick="switchTab('animation')" id="tabAnimBtn" class="py-2 text-xs font-semibold bg-indigo-600 rounded-lg transition">1. Bulk Animation ID</button>
            <button onclick="switchTab('music')" id="tabMusicBtn" class="py-2 text-xs font-semibold text-slate-400 rounded-lg transition">2. Music Bypass & Publish</button>
        </div>

        <!-- TAB 1: BULK ANIMATION REPLACER -->
        <div id="tabAnimation" class="space-y-4">
            <div>
                <label class="block text-xs font-medium mb-1 text-slate-300">Masukkan Script Lua Asli Anda</label>
                <textarea id="luaScriptInput" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs font-mono focus:outline-none focus:border-indigo-500" placeholder="Tempel script dance/emote Lua di sini..."></textarea>
            </div>
            <div>
                <label class="block text-xs font-medium mb-1 text-slate-300">Data Daftar Asset ID Baru (CSV/Tabel)</label>
                <textarea id="csvDataInput" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs font-mono focus:outline-none focus:border-indigo-500" placeholder="Copy paste tabel Asset ID dari data Anda di sini..."></textarea>
            </div>
            <button onclick="processBulkAnimation()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-lg shadow-indigo-600/30">
                Ganti ID Script Secara Massal
            </button>
            <div>
                <label class="block text-xs font-medium mb-1 text-slate-300">Hasil Script yang Sudah Diperbarui:</label>
                <textarea id="luaScriptOutput" rows="6" readonly class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs font-mono text-emerald-400 focus:outline-none"></textarea>
            </div>
        </div>

        <!-- TAB 2: MUSIC BYPASS & PUBLISH -->
        <div id="tabMusic" class="hidden space-y-4">
            <form id="musicForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium mb-1 text-slate-300">Metode Input Lagu</label>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <button type="button" id="btnYoutube" class="py-1.5 text-xs bg-indigo-600 rounded-lg font-semibold" onclick="switchMusicMode('youtube')">Link YouTube</button>
                        <button type="button" id="btnUpload" class="py-1.5 text-xs bg-slate-800 rounded-lg font-semibold" onclick="switchMusicMode('upload')">Upload File</button>
                    </div>
                </div>

                <div id="youtubeInputGroup">
                    <label class="block text-xs font-medium mb-1 text-slate-300">URL YouTube</label>
                    <input type="url" name="youtubeUrl" id="youtubeUrl" placeholder="https://youtube.com/watch?v=..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:outline-none focus:border-indigo-500">
                </div>

                <div id="fileInputGroup" class="hidden">
                    <label class="block text-xs font-medium mb-1 text-slate-300">File Audio (MP3/WAV)</label>
                    <input type="file" name="audioFile" id="audioFile" accept="audio/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white cursor-pointer">
                </div>

                <div>
                    <label class="block text-xs font-medium mb-1 text-slate-300">Nama Audio di Roblox</label>
                    <input type="text" name="assetName" required placeholder="Contoh: Lagu Remix Keren" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium mb-1 text-slate-300">Roblox User ID</label>
                        <input type="text" name="userId" required placeholder="ID Akun Anda" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1 text-slate-300">API Key</label>
                        <input type="password" name="apiKey" required placeholder="Open Cloud API Key" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <button type="submit" id="submitMusicBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-lg shadow-emerald-600/30">
                    Bypass & Auto-Publish ke Roblox
                </button>
            </form>
            <div id="statusResult" class="hidden p-3 rounded-lg text-xs text-center"></div>
        </div>
    </div>

    <script>
        // Logika Tab Navigasi
        function switchTab(tab) {
            const animTab = document.getElementById('tabAnimation');
            const musicTab = document.getElementById('tabMusic');
            const tabAnimBtn = document.getElementById('tabAnimBtn');
            const tabMusicBtn = document.getElementById('tabMusicBtn');

            if (tab === 'animation') {
                animTab.classList.remove('hidden');
                musicTab.classList.add('hidden');
                tabAnimBtn.className = "py-2 text-xs font-semibold bg-indigo-600 rounded-lg transition";
                tabMusicBtn.className = "py-2 text-xs font-semibold text-slate-400 rounded-lg transition";
            } else {
                animTab.classList.add('hidden');
                musicTab.classList.remove('hidden');
                tabMusicBtn.className = "py-2 text-xs font-semibold bg-indigo-600 rounded-lg transition";
                tabAnimBtn.className = "py-2 text-xs font-semibold text-slate-400 rounded-lg transition";
            }
        }

        // Logika Mode Music (YouTube / Upload)
        function switchMusicMode(mode) {
            const ytGroup = document.getElementById('youtubeInputGroup');
            const fileGroup = document.getElementById('fileInputGroup');
            const btnYt = document.getElementById('btnYoutube');
            const btnUp = document.getElementById('btnUpload');

            if (mode === 'youtube') {
                ytGroup.classList.remove('hidden');
                fileGroup.classList.add('hidden');
                btnYt.className = "py-1.5 text-xs bg-indigo-600 rounded-lg font-semibold";
                btnUp.className = "py-1.5 text-xs bg-slate-800 rounded-lg font-semibold";
                document.getElementById('audioFile').value = '';
            } else {
                ytGroup.classList.add('hidden');
                fileGroup.classList.remove('hidden');
                btnUp.className = "py-1.5 text-xs bg-indigo-600 rounded-lg font-semibold";
                btnYt.className = "py-1.5 text-xs bg-slate-800 rounded-lg font-semibold";
                document.getElementById('youtubeUrl').value = '';
            }
        }

        // Logika Pemrosesan Bulk Animation ID Replacer
        function processBulkAnimation() {
            let scriptText = document.getElementById('luaScriptInput').value;
            let csvText = document.getElementById('csvDataInput').value;

            if (!scriptText || !csvText) {
                alert('Harap isi script Lua dan data Asset ID terlebih dahulu!');
                return;
            }

            const rows = csvText.split('\n');
            const idMap = {};

            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length >= 2) {
                    const name = cols[0].trim().replace(/^["']|["']$/g, '');
                    const id = cols[1].trim().replace(/^["']|["']$/g, '');
                    if (name && !isNaN(id)) {
                        idMap[name.toUpperCase()] = id;
                    }
                }
            });

            // Ganti ID berdasarkan nama animasi dalam script Lua
            let updatedScript = scriptText.replace(/\{\s*"([^"]+)",\s*\d+\s*\}/g, (match, animName) => {
                const cleanName = animName.trim().toUpperCase();
                if (idMap[cleanName]) {
                    return `{ "${animName}", ${idMap[cleanName]} }`;
                }
                return match;
            });

            document.getElementById('luaScriptOutput').value = updatedScript;
        }

        // Logika Submit Form Musik ke Backend Server
        document.getElementById('musicForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitMusicBtn');
            const statusResult = document.getElementById('statusResult');

            submitBtn.disabled = true;
            submitBtn.textContent = "Memproses & Mengirim ke Roblox...";
            statusResult.className = "mt-4 p-3 rounded-lg text-xs text-center bg-blue-950 text-blue-300 border border-blue-800";
            statusResult.textContent = "Sedang mendownload/memproses audio & publish otomatis...";
            statusResult.classList.remove('hidden');

            const formData = new FormData(e.target);

            try {
                const response = await fetch('/api/process-and-publish', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    statusResult.className = "mt-4 p-3 rounded-lg text-xs text-center bg-emerald-950 text-emerald-300 border border-emerald-800";
                    statusResult.innerHTML = `<b>Berhasil Dipublish!</b><br>ID/Operation: ${result.data.operationId || 'Sukses'}`;
                } else {
                    throw new Error(JSON.stringify(result.error));
                }
            } catch (err) {
                statusResult.className = "mt-4 p-3 rounded-lg text-xs text-center bg-rose-950 text-rose-300 border border-rose-800";
                statusResult.textContent = "Gagal: " + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Bypass & Auto-Publish ke Roblox";
            }
        });
    </script>
</body>
</html>
